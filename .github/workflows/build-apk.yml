name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04   # has the Android SDK preinstalled (ANDROID_HOME)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: echo "sdk.dir=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Generate app icon + splash from assets/
        run: npx -y @capacitor/assets@4.0.0 generate --android --iconBackgroundColor '#f7ce46' --iconBackgroundColorDark '#f7ce46' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: Use the repo's fixed signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Bump version so Android sees each build as an update
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: Taffy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (phone download link)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Taffy.apk; cp Taffy.apk Stretch.apk
          gh release create "build-${{ github.run_number }}" Taffy.apk Stretch.apk \
            --title "Taffy build ${{ github.run_number }}" --notes "Tap Taffy.apk to download, then open it to install." --latest

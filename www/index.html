<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070708">
<title>Stretch</title>
<style>
/* All fonts bundled: the app looks identical offline / in the APK */
@font-face{font-family:"TikTok Sans";font-weight:400;font-display:block;src:url(fonts/tiktok-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"TikTok Sans";font-weight:600;font-display:block;src:url(fonts/tiktok-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"TikTok Sans";font-weight:700;font-display:block;src:url(fonts/tiktok-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"TikTok Sans";font-weight:900;font-display:block;src:url(fonts/tiktok-sans-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:900;font-display:block;src:url(fonts/montserrat-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Anton";font-weight:400;font-display:block;src:url(fonts/anton-latin-400-normal.woff2) format("woff2")}

/* Layout: editor shell — top bar with Save, canvas with ambient glow, tool sheet, icon toolbar (side rail on desktop) */
:root{
  --bg:#070708; --surface:#111114; --raised:#18181d; --raised2:#202027; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --fg:#f5f5f7; --muted:#8b8b97; --faint:#55555f;
  --cyan:#25f4ee; --pink:#fe2c55; --yellow:#f7ce46;
  --ui:"TikTok Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-weight:400;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button,label,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding-top:var(--sat);opacity:0;animation:boot .5s var(--ease) .05s forwards}
@keyframes boot{to{opacity:1}}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px max(16px,var(--sar)) 6px max(16px,var(--sal));position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.03em}
.mark{width:24px;height:24px;border-radius:7px;background:var(--fg);position:relative;box-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--pink)}
.mark::after{content:"";position:absolute;inset:6px 10px 6px 6px;background:var(--bg);border-radius:2px}
.spacer{flex:1}
.ghost{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);transition:transform .15s var(--ease),background .2s}
.ghost svg{width:19px;height:19px}
.ghost:active{transform:scale(.92);background:var(--raised2)}
.save{height:40px;padding:0 18px 0 14px;border-radius:13px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#fff;
  background:linear-gradient(180deg,#ff4a6c,var(--pink));box-shadow:0 6px 20px -6px rgba(254,44,85,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s var(--ease)}
.save svg{width:17px;height:17px}
.save:active{transform:scale(.95)}

/* ---------- stage ---------- */
.stage{position:relative;display:grid;place-items:center;min-height:0;padding:8px 20px 14px;isolation:isolate}
#glow{position:absolute;z-index:-1;filter:blur(46px) saturate(1.5);opacity:.55;transition:opacity .6s;pointer-events:none;border-radius:40px}
.frame{position:relative;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line2),0 24px 60px -18px rgba(0,0,0,.9);transition:box-shadow .3s}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#cv:active{cursor:grabbing}
.guides{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
.guides.on{opacity:1}
.guides i{position:absolute;background:rgba(37,244,238,.6)}
.guides .v{left:50%;top:0;bottom:0;width:1px}.guides .h{top:50%;left:0;right:0;height:1px}
.empty{position:absolute;inset:auto 0 18px 0;display:flex;justify-content:center;pointer-events:none}
.empty[hidden]{display:none}
.pill{pointer-events:auto;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:rgba(18,18,22,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:13px;transition:transform .15s var(--ease)}
.pill:active{transform:scale(.95)}
.pill svg{width:15px;height:15px}
.toast{position:absolute;left:50%;top:16px;transform:translate(-50%,-10px) scale(.96);opacity:0;padding:9px 15px;border-radius:999px;background:rgba(24,24,29,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);font-size:13px;font-weight:600;transition:.3s var(--ease);pointer-events:none;white-space:nowrap;z-index:3}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---------- tool sheet ---------- */
.sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px max(18px,var(--sar)) 6px max(18px,var(--sal));max-height:40vh;overflow:auto;scrollbar-width:none;position:relative}
.sheet::-webkit-scrollbar{display:none}
.sheet::before{content:"";position:sticky;display:block;top:-16px;margin:-10px auto 10px;width:36px;height:4px;border-radius:4px;background:var(--line2)}
.panel{display:flex;flex-direction:column;gap:14px;animation:rise .32s var(--ease)}
.panel[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ptitle{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.link{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);padding:4px 8px;margin:-4px -8px;border-radius:8px}
.link:active{background:var(--raised)}

/* sliders */
.row{display:grid;grid-template-columns:62px minmax(0,1fr) 48px;align-items:center;gap:12px;font-size:13px;font-weight:600;color:var(--muted)}
.row output{font-size:12px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--fg) var(--p,50%),var(--raised2) var(--p,50%))}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--raised2)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7.5px;box-shadow:0 0 0 4px rgba(255,255,255,.1),0 3px 10px rgba(0,0,0,.6);border:0;transition:box-shadow .15s}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 9px rgba(255,255,255,.12),0 3px 10px rgba(0,0,0,.6)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}

/* segmented controls */
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;padding:4px;background:var(--bg);border-radius:14px;border:1px solid var(--line)}
.seg button{padding:10px 0;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s,transform .12s}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--raised2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2),0 2px 8px rgba(0,0,0,.35)}
.seg button:active{transform:scale(.96)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:12px 0;border-radius:13px;background:var(--raised);border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,background .2s}
.tile svg{width:15px;height:15px}
.tile:active{transform:scale(.97);background:var(--raised2)}
.sub{font-size:13px;color:var(--muted);margin:0;line-height:1.45}

/* text */
.f-tiktok{font-family:"TikTok Sans",var(--ui)!important;font-weight:900!important}
.f-bold{font-family:"Montserrat",var(--ui)!important;font-weight:900!important}
.f-tall{font-family:"Anton",var(--ui)!important;font-weight:400!important;letter-spacing:.03em}
.textbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
textarea{width:100%;min-height:50px;max-height:110px;resize:none;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;line-height:1.35;user-select:text;-webkit-user-select:text;transition:border-color .2s}
textarea:focus{outline:none;border-color:var(--fg)}
.tbtns{display:flex;flex-direction:column;gap:6px}
.tbtns button{flex:1;width:46px;border-radius:12px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;transition:transform .12s}
.tbtns button svg{width:17px;height:17px}
.tbtns button:active{transform:scale(.93)}
.tbtns .del{color:var(--pink)}
.yellow{display:flex;align-items:center;gap:12px;width:100%;border-radius:16px;padding:12px 16px;background:linear-gradient(180deg,#fbd95c,var(--yellow));color:#141414;font-weight:700;font-size:14px;box-shadow:0 8px 24px -10px rgba(247,206,70,.55),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s var(--ease)}
.yellow .demo{font-family:"TikTok Sans",var(--ui);font-weight:900;font-size:22px;line-height:1;color:var(--yellow);-webkit-text-stroke:5px #000;paint-order:stroke fill}
.yellow small{margin-left:auto;font-weight:600;opacity:.6;font-size:12px}
.yellow:active{transform:scale(.97)}
.swatches{display:flex;gap:10px;overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none}
.swatches::-webkit-scrollbar{display:none}
.sw{width:32px;height:32px;border-radius:50%;background:var(--c);flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .15s var(--ease)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg);transform:scale(.9)}
.sw.custom{background:conic-gradient(#ff3b3b,#ffd400,#3bff7a,#25f4ee,#5b4bff,#fe2c55,#ff3b3b);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.empty-text{display:flex;flex-direction:column;gap:10px}

/* ---------- toolbar ---------- */
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);padding:4px max(10px,var(--sar)) calc(8px + var(--sab)) max(10px,var(--sal))}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 6px;color:var(--faint);font-size:11px;font-weight:600;transition:color .2s;position:relative}
.tool .ic{width:46px;height:32px;border-radius:11px;display:grid;place-items:center;transition:background .25s var(--ease),transform .15s var(--ease)}
.tool svg{width:21px;height:21px}
.tool[aria-selected="true"]{color:var(--fg)}
.tool[aria-selected="true"] .ic{background:var(--raised2)}
.tool:active .ic{transform:scale(.9)}

/* desktop: side rail */
@media (min-width:860px){
  .app{grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr) auto}
  .top{grid-column:1/-1}
  .stage{grid-row:2/4}
  .sheet{grid-column:2;grid-row:2;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);padding-top:22px}
  .sheet::before{display:none}
  .toolbar{grid-column:2;grid-row:3;border-left:1px solid var(--line);border-top:1px solid var(--line)}
}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.app{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span class="mark"></span>Stretch</div>
    <span class="spacer"></span>
    <label class="ghost" for="file" aria-label="Choose image" title="Choose image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
    </label>
    <input id="file" type="file" accept="image/*">
    <button class="save" id="export">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 20h14"/></svg>
      Save
    </button>
  </header>

  <main class="stage" id="stage">
    <canvas id="glow" width="27" height="48" aria-hidden="true"></canvas>
    <div class="frame" id="frame">
      <canvas id="cv" width="1080" height="1920" aria-label="9:16 preview"></canvas>
      <div class="guides" id="guides"><i class="v"></i><i class="h"></i></div>
      <div class="empty" id="empty">
        <label class="pill" for="file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add your image
        </label>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <section class="sheet" id="sheet">
    <!-- Stretch -->
    <div class="panel" data-panel="0">
      <div class="ptitle">Stretch image <button class="link" id="reset">Reset</button></div>
      <div class="row"><span>Width</span><input id="sw" type="range" min="20" max="400" value="178"><output id="swo"></output></div>
      <div class="row"><span>Height</span><input id="sh" type="range" min="20" max="400" value="100"><output id="sho"></output></div>
      <div class="seg" id="anchor">
        <button data-a="left" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></svg>Left</button>
        <button data-a="center" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>Both</button>
        <button data-a="right" aria-pressed="true">Right<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </div>
      <div class="duo">
        <button class="tile" id="fillH"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg>Fill height</button>
        <button class="tile" id="fillAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fill screen</button>
      </div>
    </div>

    <!-- Text -->
    <div class="panel" data-panel="1" hidden>
      <div id="tnone" class="empty-text">
        <button class="yellow" id="addYellow"><span class="demo">Aa</span>Add TikTok yellow text<small>1 tap</small></button>
        <button class="tile" id="addText">+ Add plain text</button>
        <p class="sub">Tap text on the canvas to edit it. Drag to move it and pinch to resize it.</p>
      </div>
      <div id="tedit" class="panel" hidden style="animation:none">
        <div class="textbar">
          <textarea id="txt" rows="2" placeholder="Type your text" aria-label="Text"></textarea>
          <div class="tbtns">
            <button id="addText2" aria-label="Add another text" title="New text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <button id="delText" class="del" aria-label="Delete text" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
          </div>
        </div>
        <button class="yellow" id="yellowNow"><span class="demo">Aa</span>TikTok yellow<small>tap to apply</small></button>
        <div class="swatches" id="colors">
          <button class="sw" data-c="#ffffff" style="--c:#ffffff" aria-label="White" aria-pressed="false"></button>
          <button class="sw" data-c="#f7ce46" style="--c:#f7ce46" aria-label="TikTok yellow" aria-pressed="false"></button>
          <button class="sw" data-c="#000000" style="--c:#000000" aria-label="Black" aria-pressed="false"></button>
          <button class="sw" data-c="#fe2c55" style="--c:#fe2c55" aria-label="Pink" aria-pressed="false"></button>
          <button class="sw" data-c="#25f4ee" style="--c:#25f4ee" aria-label="Cyan" aria-pressed="false"></button>
          <button class="sw" data-c="#ff8a00" style="--c:#ff8a00" aria-label="Orange" aria-pressed="false"></button>
          <button class="sw" data-c="#7cff4f" style="--c:#7cff4f" aria-label="Green" aria-pressed="false"></button>
          <label class="sw custom" aria-label="Custom colour"><input type="color" id="customColor" value="#a78bfa"></label>
        </div>
        <div class="seg" id="fontPick">
          <button class="f-tiktok" data-f="tiktok" aria-pressed="true">TikTok</button>
          <button class="f-bold" data-f="bold" aria-pressed="false">Bold</button>
          <button class="f-tall" data-f="tall" aria-pressed="false">TALL</button>
        </div>
        <div class="seg" id="stylePick">
          <button data-s="outline" aria-pressed="true">Outline</button>
          <button data-s="box" aria-pressed="false">Box</button>
          <button data-s="plain" aria-pressed="false">Plain</button>
        </div>
        <div class="row"><span>Size</span><input id="tsz" type="range" min="30" max="400" value="120"><output id="tszo"></output></div>
        <div class="row"><span>Width</span><input id="tsw" type="range" min="20" max="500" value="100"><output id="tswo"></output></div>
        <div class="row"><span>Height</span><input id="tsh" type="range" min="20" max="500" value="100"><output id="tsho"></output></div>
      </div>
    </div>

    <!-- Blur -->
    <div class="panel" data-panel="2" hidden>
      <div class="ptitle">Blur</div>
      <div class="row"><span>Image</span><input id="blur" type="range" min="0" max="60" value="0"><output id="bluro"></output></div>
      <div class="row"><span>Backdrop</span><input id="bgblur" type="range" min="0" max="120" value="50"><output id="bgbluro"></output></div>
      <p class="sub">Backdrop blur shows when the backdrop is set to Blurred.</p>
    </div>

    <!-- Backdrop -->
    <div class="panel" data-panel="3" hidden>
      <div class="ptitle">Backdrop</div>
      <div class="seg" id="bgmode">
        <button data-m="blur" aria-pressed="true">Blurred</button>
        <button data-m="black" aria-pressed="false">Black</button>
        <button data-m="white" aria-pressed="false">White</button>
      </div>
      <div class="row"><span>Bright</span><input id="bgbr" type="range" min="20" max="120" value="80"><output id="bgbro"></output></div>
    </div>
  </section>

  <nav class="toolbar" role="tablist" aria-label="Tools">
    <button class="tool" role="tab" aria-selected="true" data-tab="0"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="10" height="14" rx="2"/><path d="M3 12h2M19 12h2M4 10l-1.5 2L4 14M20 10l1.5 2L20 14"/></svg></span>Stretch</button>
    <button class="tool" role="tab" aria-selected="false" data-tab="1"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg></span>Text</button>
    <button class="tool" role="tab" aria-selected="false" data-tab="2"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 2.5" opacity=".6"/></svg></span>Blur</button>
    <button class="tool" role="tab" aria-selected="false" data-tab="3"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><rect x="8" y="7" width="8" height="10" rx="1.5"/></svg></span>Backdrop</button>
  </nav>
</div>

<script>
const W=1080,H=1920;
const TT_YELLOW='#f7ce46';
const FONTS={
  tiktok:{family:'"TikTok Sans"',weight:900},
  bold:{family:'Montserrat',weight:900},
  tall:{family:'Anton',weight:400}
};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const glow=$('glow'),gctx=glow.getContext('2d');
const Cap=window.Capacitor, native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
let img=null,anchor='right',bgmode='blur',x=0,y=0,prevW=0,prevH=0;
let texts=[], sel=null, exporting=false, curTab=0;

/* ---------- layout: fit the 9:16 frame inside the stage ---------- */
function fit(){
  const r=$('stage').getBoundingClientRect();
  const aw=r.width-40, ah=r.height-22;
  let h=ah, w=h*9/16; if(w>aw){w=aw;h=w*16/9;}
  w=Math.max(0,Math.floor(w));h=Math.max(0,Math.floor(h));
  $('frame').style.width=w+'px';$('frame').style.height=h+'px';
  glow.style.width=w*1.25+'px';glow.style.height=h*1.08+'px';
}
new ResizeObserver(fit).observe($('stage'));

/* ---------- image drawing ---------- */
function size(){const b=W/img.width;return{w:img.width*b*$('sw').value/100,h:img.height*b*$('sh').value/100};}
function place(){if(!img)return;const{w,h}=size();x=anchor==='left'?W-w:anchor==='right'?0:(W-w)/2;y=(H-h)/2;prevW=w;prevH=h;draw();}
function track(el){const p=(el.value-el.min)/(el.max-el.min)*100;el.style.setProperty('--p',p+'%');}
function labels(){
  $('swo').textContent=$('sw').value+'%';$('sho').textContent=$('sh').value+'%';
  $('bluro').textContent=$('blur').value+'px';$('bgbluro').textContent=$('bgblur').value+'px';
  $('bgbro').textContent=$('bgbr').value+'%';
  $('tszo').textContent=$('tsz').value;$('tswo').textContent=$('tsw').value+'%';$('tsho').textContent=$('tsh').value+'%';
  document.querySelectorAll('input[type=range]').forEach(track);
}

/* ---------- text layers ---------- */
function isLight(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150;}
function setFont(t){const f=FONTS[t.font];ctx.font=`${f.weight} ${t.size}px ${f.family}, sans-serif`;}
function metrics(t){
  setFont(t);
  const lines=(t.text||' ').split('\n'), lh=t.size*1.12;
  const widths=lines.map(l=>ctx.measureText(l||' ').width);
  const pad=t.style==='box'?t.size*.28:t.style==='outline'?t.size*.12:t.size*.04;
  return{lines,lh,widths,pad,maxw:Math.max(...widths)};
}
function bounds(t){
  const m=metrics(t);
  const w=(m.maxw+m.pad*2)*t.sx/100, h=(m.lines.length*m.lh+m.pad*.8)*t.sy/100;
  return{x:t.x-w/2,y:t.y-h/2,w,h};
}
function rr(x0,y0,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x0,y0,w,h,r);else ctx.rect(x0,y0,w,h);}
function drawText(t){
  const m=metrics(t);
  ctx.save();ctx.translate(t.x,t.y);ctx.scale(t.sx/100,t.sy/100);
  setFont(t);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.miterLimit=2;
  const total=m.lines.length*m.lh;
  if(t.style==='box'){ // TikTok-style rounded background block
    ctx.fillStyle=t.color;
    m.lines.forEach((ln,i)=>{const ly=-total/2+m.lh*i, w=m.widths[i]+m.pad*2;rr(-w/2,ly-m.pad*.15,w,m.lh+m.pad*.3,t.size*.2);ctx.fill();});
  }
  m.lines.forEach((ln,i)=>{
    const ly=-total/2+m.lh*(i+.5)+t.size*.04;
    if(t.style==='outline'){
      ctx.lineWidth=t.size*.17;ctx.strokeStyle=isLight(t.color)?'#000':'#fff';ctx.strokeText(ln,0,ly);
      ctx.fillStyle=t.color;ctx.fillText(ln,0,ly);
    }else if(t.style==='box'){
      ctx.fillStyle=isLight(t.color)?'#000':'#fff';ctx.fillText(ln,0,ly);
    }else{
      ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=t.size*.18;ctx.shadowOffsetY=t.size*.04;
      ctx.fillStyle=t.color;ctx.fillText(ln,0,ly);ctx.shadowColor='transparent';
    }
  });
  ctx.restore();
}
function drawSelection(t){
  const b=bounds(t),p=14;
  ctx.save();ctx.lineWidth=4;ctx.setLineDash([20,12]);
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.strokeRect(b.x-p+2,b.y-p+2,b.w+p*2,b.h+p*2);
  ctx.strokeStyle='#fff';ctx.strokeRect(b.x-p,b.y-p,b.w+p*2,b.h+p*2);
  ctx.setLineDash([]);
  [[b.x-p,b.y-p],[b.x+b.w+p,b.y-p],[b.x-p,b.y+b.h+p],[b.x+b.w+p,b.y+b.h+p]].forEach(([cx,cy])=>{
    ctx.beginPath();ctx.arc(cx,cy,13,0,7);ctx.fillStyle='#fff';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,6,0,7);ctx.fillStyle='#25f4ee';ctx.fill();
  });
  ctx.restore();
}

/* ---------- main draw ---------- */
let glowQueued=false;
function updateGlow(){glowQueued=false;gctx.drawImage(cv,0,0,glow.width,glow.height);}
function draw(){
  labels();
  ctx.filter='none';ctx.fillStyle=bgmode==='white'?'#fff':'#000';ctx.fillRect(0,0,W,H);
  if(img){
    if(bgmode==='blur'){
      const s=Math.max(W/img.width,H/img.height)*1.15,bw=img.width*s,bh=img.height*s;
      ctx.filter=`blur(${$('bgblur').value}px) brightness(${$('bgbr').value/100})`;
      ctx.drawImage(img,(W-bw)/2,(H-bh)/2,bw,bh);
    }
    const{w,h}=size();
    ctx.filter=+$('blur').value?`blur(${$('blur').value}px)`:'none';
    ctx.drawImage(img,x,y,w,h);ctx.filter='none';
  }
  texts.forEach(drawText);
  if(sel&&!exporting)drawSelection(sel);
  if(!glowQueued){glowQueued=true;requestAnimationFrame(updateGlow);}
}

/* ---------- sample image so the stage isn't empty ---------- */
(function sample(){
  const c=document.createElement('canvas');c.width=c.height=900;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,900,900);gr.addColorStop(0,'#25f4ee');gr.addColorStop(.55,'#5b4bff');gr.addColorStop(1,'#fe2c55');
  g.fillStyle=gr;g.fillRect(0,0,900,900);
  for(let i=0;i<9;i++){g.beginPath();g.arc(450,450,60+i*55,0,7);g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.15)';g.stroke();}
  g.fillStyle='#fff';g.beginPath();g.arc(450,450,120,0,7);g.fill();
  const i=new Image();i.onload=()=>{img=i;place();};i.src=c.toDataURL();
})();

/* ---------- tools ---------- */
function showTab(n){
  if(n===curTab&&!$('sheet').querySelector(`.panel[data-panel="${n}"]`).hidden)return;
  curTab=n;
  document.querySelectorAll('.tool').forEach(o=>o.setAttribute('aria-selected',+o.dataset.tab===n));
  document.querySelectorAll('.panel[data-panel]').forEach(p=>p.hidden=+p.dataset.panel!==n);
  $('sheet').scrollTop=0;
}
document.querySelectorAll('.tool').forEach(t=>t.addEventListener('click',()=>{showTab(+t.dataset.tab);vibe();}));

/* ---------- image controls ---------- */
['sw','sh'].forEach(id=>$(id).addEventListener('input',()=>{
  if(!img)return;const{w,h}=size();
  if(anchor==='left')x-=w-prevW;else if(anchor==='center')x-=(w-prevW)/2;
  y-=(h-prevH)/2;prevW=w;prevH=h;draw();
}));
['blur','bgblur','bgbr'].forEach(id=>$(id).addEventListener('input',draw));
function press(id,key,val){$(id).querySelectorAll('button').forEach(o=>o.setAttribute('aria-pressed',o.dataset[key]===val));}
function group(id,key,cb){$(id).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{press(id,key,b.dataset[key]);cb(b.dataset[key]);vibe();}));}
group('anchor','a',a=>{anchor=a;place();});
group('bgmode','m',m=>{bgmode=m;draw();});
$('fillH').onclick=()=>{if(!img)return;$('sh').value=Math.min(400,Math.round(H/(img.height*W/img.width)*100));place();vibe();};
$('fillAll').onclick=()=>{if(!img)return;$('sw').value=100;$('sh').value=Math.min(400,Math.round(H/(img.height*W/img.width)*100));place();vibe();};
$('reset').onclick=()=>{$('sw').value=178;$('sh').value=100;$('blur').value=0;$('bgblur').value=50;$('bgbr').value=80;place();vibe();toast('Image reset');};

/* ---------- text controls ---------- */
function syncTextUI(){
  $('tnone').hidden=!!sel;$('tedit').hidden=!sel;
  if(!sel){draw();return;}
  if(document.activeElement!==$('txt'))$('txt').value=sel.text;
  $('tsz').value=Math.round(sel.size);$('tsw').value=Math.round(sel.sx);$('tsh').value=Math.round(sel.sy);
  press('fontPick','f',sel.font);press('stylePick','s',sel.style);
  $('colors').querySelectorAll('.sw[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===sel.color));
  draw();
}
function addText(preset){
  const t=Object.assign({text:'your text here',font:'tiktok',color:'#ffffff',style:'outline',size:120,sx:100,sy:100,x:W/2,y:H*.3+(texts.length*170)%(H*.5)},preset||{});
  texts.push(t);sel=t;showTab(1);syncTextUI();vibe();
  setTimeout(()=>{$('txt').focus();$('txt').select();},80);
}
const yellowPreset={color:TT_YELLOW,style:'outline',font:'tiktok'};
$('addYellow').onclick=()=>addText(yellowPreset);
$('addText').onclick=()=>addText();
$('addText2').onclick=()=>addText(sel?{font:sel.font,color:sel.color,style:sel.style}:null);
$('yellowNow').onclick=()=>{if(!sel)return;sel.color=TT_YELLOW;if(sel.style==='plain')sel.style='outline';syncTextUI();vibe();toast('TikTok yellow');};
$('delText').onclick=()=>{texts=texts.filter(t=>t!==sel);sel=null;syncTextUI();vibe();toast('Text deleted');};
function autoFit(t){const b=bounds(t),max=W*.92;if(b.w>max){t.size=Math.max(30,t.size*max/b.w);$('tsz').value=Math.round(t.size);}}
$('txt').addEventListener('input',e=>{if(sel){sel.text=e.target.value;autoFit(sel);draw();}});
$('colors').querySelectorAll('.sw[data-c]').forEach(b=>b.addEventListener('click',()=>{if(!sel)return;sel.color=b.dataset.c;syncTextUI();vibe();}));
$('customColor').addEventListener('input',e=>{if(!sel)return;sel.color=e.target.value;syncTextUI();});
group('fontPick','f',f=>{if(sel){sel.font=f;syncTextUI();}});
group('stylePick','s',s=>{if(sel){sel.style=s;syncTextUI();}});
$('tsz').addEventListener('input',e=>{if(sel){sel.size=+e.target.value;draw();}});
$('tsw').addEventListener('input',e=>{if(sel){sel.sx=+e.target.value;draw();}});
$('tsh').addEventListener('input',e=>{if(sel){sel.sy=+e.target.value;draw();}});

/* ---------- image input ---------- */
function load(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file);const i=new Image();
  i.onload=()=>{img=i;$('empty').hidden=true;place();toast('Image loaded');};
  i.src=url;
}
$('file').onchange=e=>{load(e.target.files[0]);e.target.value='';};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0]);});
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])][0];if(f)load(f);});

/* ---------- touch: tap to select, drag to move, pinch to scale, double-tap ---------- */
const pts=new Map();let start=null,lastTap=0;
const k=()=>W/cv.getBoundingClientRect().width;
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*k(),y:(e.clientY-r.top)*k()};}
function hit(p){for(let i=texts.length-1;i>=0;i--){const b=bounds(texts[i]),m=24;if(p.x>=b.x-m&&p.x<=b.x+b.w+m&&p.y>=b.y-m&&p.y<=b.y+b.h+m)return texts[i];}return null;}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    const t=hit(toCanvas(e));
    if(t!==sel){sel=t;if(t){texts=texts.filter(o=>o!==t);texts.push(t);showTab(1);vibe();}syncTextUI();}
    const now=Date.now();
    if(now-lastTap<280){ if(sel){sel.x=W/2;draw();}else place(); vibe(); }
    lastTap=now;
  }
  snap();$('guides').classList.add('on');
});
function snap(){
  const p=[...pts.values()];
  start={x,y,sw:+$('sw').value,sh:+$('sh').value,
    tx:sel?.x,ty:sel?.y,tsize:sel?.size,
    cx:p.reduce((a,b)=>a+b.x,0)/p.length,cy:p.reduce((a,b)=>a+b.y,0)/p.length,
    d:p.length>1?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0};
}
let snapped=false;
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const p=[...pts.values()],s=k();
  const cx=p.reduce((a,b)=>a+b.x,0)/p.length,cy=p.reduce((a,b)=>a+b.y,0)/p.length;
  const f=p.length>1&&start.d?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/start.d:1;
  if(sel){
    sel.x=start.tx+(cx-start.cx)*s;sel.y=start.ty+(cy-start.cy)*s;
    const sx=Math.abs(sel.x-W/2)<18, sy=Math.abs(sel.y-H/2)<18;
    if(sx)sel.x=W/2; if(sy)sel.y=H/2;
    if((sx||sy)&&!snapped)vibe(); snapped=sx||sy;
    if(f!==1){sel.size=Math.max(30,Math.min(400,start.tsize*f));$('tsz').value=Math.round(sel.size);}
  }else if(img){
    if(f!==1){
      const nsw=Math.max(20,Math.min(400,start.sw*f)),nsh=Math.max(20,Math.min(400,start.sh*f));
      const b=W/img.width,ow=img.width*b*start.sw/100,oh=img.height*b*start.sh/100,nw=img.width*b*nsw/100,nh=img.height*b*nsh/100;
      $('sw').value=Math.round(nsw);$('sh').value=Math.round(nsh);
      x=start.x-(nw-ow)/2+(cx-start.cx)*s;y=start.y-(nh-oh)/2+(cy-start.cy)*s;prevW=nw;prevH=nh;
    }else{x=start.x+(cx-start.cx)*s;y=start.y+(cy-start.cy)*s;}
  }
  draw();
});
function up(e){pts.delete(e.pointerId);if(pts.size)snap();else $('guides').classList.remove('on');}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- export ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600);}
function vibe(){try{navigator.vibrate&&navigator.vibrate(8);}catch(_){}}
const fname=()=>'stretch_'+Date.now()+'.png';

$('export').onclick=async()=>{
  vibe();
  exporting=true;draw();
  const dataUrl=cv.toDataURL('image/png');
  exporting=false;draw();
  try{
    if(native&&Cap.Plugins.Filesystem&&Cap.Plugins.Share){
      // APK: write PNG to cache, then open the share sheet (Save to Photos, TikTok, Drive…)
      const r=await Cap.Plugins.Filesystem.writeFile({path:fname(),data:dataUrl.split(',')[1],directory:'CACHE'});
      await Cap.Plugins.Share.share({title:'Stretch export',files:[r.uri]});
      return;
    }
    const blob=await (await fetch(dataUrl)).blob();
    const file=new File([blob],fname(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){
      await navigator.share({files:[file]});return;
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Saved');
  }catch(err){if(err&&err.name!=='AbortError'&&!/cancel/i.test(err.message||''))toast('Couldn’t save: '+(err.message||err));}
};

/* fonts must be loaded before canvas can use them */
Promise.all([
  document.fonts.load('900 60px "TikTok Sans"'),
  document.fonts.load('900 60px Montserrat'),
  document.fonts.load('400 60px Anton')
]).catch(()=>{}).then(draw);
fit();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Taffy</title>
<link rel="icon" href="icon.png">
<style>
@font-face{font-family:"TikTok Sans";font-weight:400;font-display:block;src:url(fonts/tiktok-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"TikTok Sans";font-weight:600;font-display:block;src:url(fonts/tiktok-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"TikTok Sans";font-weight:700;font-display:block;src:url(fonts/tiktok-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"TikTok Sans";font-weight:900;font-display:block;src:url(fonts/tiktok-sans-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:900;font-display:block;src:url(fonts/montserrat-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Anton";font-weight:400;font-display:block;src:url(fonts/anton-latin-400-normal.woff2) format("woff2")}

/* Flat editor UI: black chrome, grey workspace, one accent (caption yellow). Tools open a panel; ✓ closes it. */
:root{
  --bg:#000; --work:#101011; --s1:#1a1a1b; --s2:#262628; --s3:#323235; --line:#2b2b2e;
  --fg:#fff; --fg2:#d6d6da; --muted:#8e8e93; --dim:#5c5c61;
  --accent:#f7ce46; --on-accent:#000; --danger:#ff453a;
  --ui:"TikTok Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
button,label,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
[hidden]{display:none!important}
input[type=file]{display:none}
.screen{height:100%;max-width:560px;margin:0 auto}

/* ================= HOME ================= */
.home{overflow:auto;scrollbar-width:none;padding:calc(var(--sat) + 14px) max(16px,var(--sar)) calc(var(--sab) + 24px) max(16px,var(--sal))}
.home::-webkit-scrollbar{display:none}
.hbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:14px}
.wordmark{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;letter-spacing:-.04em}
.wordmark img{width:34px;height:34px;border-radius:9px}
.create{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:28px}
.ct{position:relative;height:104px;border-radius:12px;background:var(--s1);display:flex;flex-direction:column;justify-content:space-between;padding:12px;text-align:left;cursor:pointer;transition:transform .12s}
.ct:active{transform:scale(.97)}
.ct svg{width:26px;height:26px}
.ct b{font-size:14px;font-weight:700;line-height:1.15}
.ct small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.ct.primary{background:var(--accent);color:var(--on-accent)}
.ct.primary small{color:rgba(0,0,0,.6)}
.hsec{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.hsec h2{margin:0;font-size:17px;font-weight:700}
.hsec span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.card{min-width:0;text-align:left}
.th{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:8px;overflow:hidden;background:var(--s1);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th:active{opacity:.8}
.more{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:rgba(0,0,0,.5)}
.more svg{width:16px;height:16px}
.card b{display:block;margin-top:7px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.none{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.none svg{width:36px;height:36px;margin:0 auto 10px;color:var(--dim)}

/* action sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.asheet{width:100%;max-width:560px;background:var(--s1);border-radius:14px 14px 0 0;padding:8px max(8px,var(--sar)) calc(10px + var(--sab)) max(8px,var(--sal));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.ahead{display:flex;align-items:center;gap:12px;padding:10px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ahead img{width:36px;aspect-ratio:9/16;border-radius:4px;object-fit:cover;background:var(--s2)}
.ahead b{display:block;font-size:15px;font-weight:700}
.ahead small{font-size:12px;color:var(--muted)}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:8px;font-size:15px;text-align:left}
.act svg{width:20px;height:20px;color:var(--muted)}
.act:active{background:var(--s2)}
.act.red,.act.red svg{color:var(--danger)}
.act.red.armed{background:var(--danger);color:#fff}
.act.red.armed svg{color:#fff}
.rename{display:flex;gap:8px;padding:8px 4px}
.rename input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:15px;user-select:text;-webkit-user-select:text}
.rename input:focus{outline:none;border-color:var(--fg2)}
.rename button{padding:0 18px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:700}

/* ================= EDITOR ================= */
.app{display:flex;flex-direction:column;padding-top:var(--sat);background:var(--bg)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 max(8px,var(--sar)) 0 max(4px,var(--sal));flex:none}
.top .l{display:flex;align-items:center;min-width:0}
.top .r{display:flex;justify-content:flex-end}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:8px}
.ib svg{width:22px;height:22px}
.ib:active:not(:disabled){background:var(--s1)}
.pname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2);padding-right:6px}
.hist{display:flex;gap:2px}
.export{height:34px;padding:0 16px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700}
.export:active{opacity:.8}

.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;background:var(--work);padding:14px}
.frame{position:relative;background:#000;outline:1px solid rgba(255,255,255,.06)}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.guides{position:absolute;inset:0;pointer-events:none;display:none}
.guides.on{display:block}
.guides i{position:absolute;background:var(--accent);opacity:.7}
.guides .v{left:50%;top:0;bottom:0;width:1px}.guides .h{top:50%;left:0;right:0;height:1px}
.addphoto{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;background:#fff;color:#000;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
.addphoto svg{width:16px;height:16px}

/* tool panel */
.panelwrap{flex:none;background:var(--s1);border-top:1px solid var(--line)}
.phead{display:flex;align-items:center;justify-content:space-between;height:46px;padding:0 max(6px,var(--sar)) 0 max(16px,var(--sal))}
.phead b{font-size:15px;font-weight:700}
.phead .done{width:40px;height:40px;display:grid;place-items:center;color:var(--accent)}
.phead .done svg{width:24px;height:24px}
.pbody{max-height:34vh;overflow:auto;scrollbar-width:none;padding:2px max(16px,var(--sar)) 16px max(16px,var(--sal))}
.pbody::-webkit-scrollbar{display:none}
.panel{display:flex;flex-direction:column;gap:14px}

.row{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:14px;color:var(--fg2)}
.row output{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--fg) var(--p,50%),var(--s3) var(--p,50%))}
input[type=range]::-moz-range-track{height:3px;background:var(--s3)}
input[type=range]::-moz-range-progress{height:3px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-7.5px;border:0}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0}

.opts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opt{flex:1 0 auto;min-width:76px;height:38px;padding:0 12px;border-radius:8px;background:var(--s2);color:var(--fg2);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid transparent}
.opt svg{width:16px;height:16px}
.opt[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--s3)}
.opt:active{opacity:.75}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.45}

.f-tiktok{font-family:"TikTok Sans",var(--ui)!important;font-weight:900!important}
.f-bold{font-family:"Montserrat",var(--ui)!important;font-weight:900!important}
.f-tall{font-family:"Anton",var(--ui)!important;font-weight:400!important}
.tinput{display:flex;gap:8px}
textarea{flex:1;min-width:0;height:48px;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:15px;line-height:1.3;user-select:text;-webkit-user-select:text}
textarea:focus{outline:none;border-color:var(--fg2)}
.sq{width:48px;height:48px;border-radius:8px;background:var(--s2);display:grid;place-items:center;flex:none}
.sq svg{width:20px;height:20px}
.sq.red{color:var(--danger)}
.sq:active{opacity:.75}
.swatches{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.swatches::-webkit-scrollbar{display:none}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);flex:none;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--fg)}
.sw.yl{width:auto;border-radius:15px;padding:0 12px 0 10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#000}
.sw.custom{background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:8px;font-size:15px;font-weight:700;background:var(--s2)}
.bigbtn.acc{background:var(--accent);color:var(--on-accent)}
.bigbtn svg{width:18px;height:18px}
.bigbtn:active{opacity:.8}

/* toolbar */
.toolbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding:6px max(4px,var(--sar)) calc(6px + var(--sab)) max(4px,var(--sal))}
.tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;color:var(--muted)}
.tool svg{width:24px;height:24px;color:var(--fg)}
.tool[aria-selected="true"],.tool[aria-selected="true"] svg{color:var(--accent)}
.tool:active svg{transform:scale(.9)}

.qwide{display:flex;align-items:center;gap:12px;width:100%;margin:-18px 0 28px;padding:14px;border-radius:12px;background:var(--s1);text-align:left}
.qwide:active{opacity:.8}
.qwide .qi{width:40px;height:40px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--accent);font-size:28px;font-weight:900;line-height:1;padding-top:10px}
.qwide b{display:block;font-size:14px;font-weight:700}
.qwide small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.qwide svg{width:18px;height:18px;margin-left:auto;color:var(--muted)}
/* quote picker */
.qp{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sat);animation:fade .15s}
.qp-in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.qtop{display:flex;align-items:center;gap:4px;height:52px;padding:0 max(8px,var(--sar)) 0 max(4px,var(--sal));flex:none}
.qtop h2{margin:0;font-size:17px;font-weight:700;flex:1}
.qtop h2 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.shuf{height:34px;padding:0 12px;border-radius:8px;background:var(--s2);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.shuf svg{width:16px;height:16px}
.qsearch{margin:0 max(16px,var(--sar)) 10px max(16px,var(--sal));position:relative;flex:none}
.qsearch input{width:100%;height:42px;border-radius:10px;background:var(--s1);border:1px solid transparent;padding:0 12px 0 38px;font-size:15px;user-select:text;-webkit-user-select:text}
.qsearch input:focus{outline:none;border-color:var(--line)}
.qsearch svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 max(16px,var(--sar)) 12px max(16px,var(--sal));flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--s1);color:var(--fg2);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:#000}
.qlist{flex:1;overflow:auto;scrollbar-width:none;padding:0 max(16px,var(--sar)) calc(var(--sab) + 20px) max(16px,var(--sal));display:flex;flex-direction:column;gap:8px}
.qlist::-webkit-scrollbar{display:none}
.q{display:flex;align-items:stretch;background:var(--s1);border-radius:10px;min-height:56px}
.q .qt{flex:1;min-width:0;text-align:left;padding:13px 4px 13px 14px;font-size:15px;font-weight:600;line-height:1.35}
.q .qt small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.04em}
.q .qt:active{opacity:.7}
.q .qa{display:flex;flex-direction:column;justify-content:center;padding-right:4px}
.q .qa button{width:38px;height:34px;display:grid;place-items:center;color:var(--muted)}
.q .qa button svg{width:18px;height:18px}
.q .qa button[aria-pressed="true"]{color:var(--accent)}
.qnone{text-align:center;color:var(--muted);font-size:14px;padding:40px 10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 140px);transform:translateX(-50%);padding:9px 14px;border-radius:8px;background:var(--s3);font-size:13px;font-weight:600;white-space:nowrap;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section class="screen home" id="home">
  <div class="hbar"><div class="wordmark"><img src="icon.png" alt="">Taffy</div></div>

  <div class="create">
    <label class="ct primary" for="newFile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
      <span><b>New project</b><small>From a photo</small></span>
    </label>
    <button class="ct" id="newText">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>
      <span><b>Text</b><small>Caption only</small></span>
    </button>
    <button class="ct" id="newBlank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2"/></svg>
      <span><b>Blank</b><small>9:16</small></span>
    </button>
  </div>
  <input id="newFile" type="file" accept="image/*">
  <button class="qwide" id="homeQuotes">
    <span class="qi">&ldquo;</span>
    <span><b>Quote library</b><small id="qcountHome">Captions for your next post</small></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>

  <div class="hsec"><h2>Drafts</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
  <div class="none" id="none" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M10 9h4M10 12h4"/></svg>
    No drafts yet. Projects save here automatically.
  </div>
</section>

<div class="scrim" id="scrim" hidden>
  <div class="asheet" role="dialog" aria-label="Draft options">
    <div class="ahead"><img id="mThumb" alt=""><div><b id="mName"></b><small id="mDate"></small></div></div>
    <div id="mActions">
      <button class="act" data-act="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Edit</button>
      <button class="act" data-act="rename"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>Rename</button>
      <button class="act" data-act="dupe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>Duplicate</button>
      <button class="act red" data-act="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Delete</span></button>
    </div>
    <form class="rename" id="mRename" hidden><input id="mInput" maxlength="40" aria-label="Draft name"><button type="submit">Save</button></form>
  </div>
</div>

<!-- ================= EDITOR ================= -->
<div class="screen app" id="editor" hidden>
  <header class="top">
    <div class="l">
      <button class="ib" id="back" aria-label="Back to drafts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="pname" id="projName"></span>
    </div>
    <div class="hist">
      <button class="ib" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib" id="redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div class="r"><button class="export" id="export">Export</button></div>
  </header>

  <main class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv" width="1080" height="1920" aria-label="9:16 canvas"></canvas>
      <div class="guides" id="guides"><i class="v"></i><i class="h"></i></div>
      <label class="addphoto" id="empty" for="file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add photo</label>
    </div>
  </main>
  <input id="file" type="file" accept="image/*">

<script src="quotes.js"></script>
<script>
const W=1080,H=1920;
const TT_YELLOW='#f7ce46';
const FONTS={tiktok:{family:'"TikTok Sans"',weight:900},bold:{family:'Montserrat',weight:900},tall:{family:'Anton',weight:400}};
const TOOLS=['Stretch','Text','Adjust','Blur','Backdrop'];
const DEF={sw:178,sh:100,blur:0,bgblur:50,bgbr:80,bri:100,con:100,sat:100,anchor:'right',bgmode:'blur',flip:false};
const SLIDERS=['sw','sh','blur','bgblur','bgbr','bri','con','sat'];
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const thumbCv=Object.assign(document.createElement('canvas'),{width:216,height:384}),tctx=thumbCv.getContext('2d');
const Cap=window.Capacitor, native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
let img=null,imgBlob=null,anchor='right',bgmode='blur',flip=false,x=0,y=0,prevW=0,prevH=0;
let texts=[],sel=null,exporting=false,tab=-1;
let proj=null,loading=false,saving=false,saveT=null;
const imgCache=new Map();

/* ================= STORAGE ================= */
let dbp=null;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('stretch',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('projects',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('projects',mode);const r=fn(t.objectStore('projects'));
  t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});}
const dbAll=()=>tx('readonly',s=>s.getAll()),dbPut=p=>tx('readwrite',s=>s.put(p)),dbDel=id=>tx('readwrite',s=>s.delete(id));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

/* ================= HOME ================= */
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'Just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<86400*7)return Math.floor(s/86400)+'d ago';return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let projects=[];
async function renderHome(){
  try{projects=(await dbAll()).sort((a,b)=>b.updated-a.updated);}catch(e){projects=[];}
  $('count').textContent=projects.length||'';$('none').hidden=projects.length>0;
  const g=$('grid');g.innerHTML='';
  projects.forEach(p=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="th" role="button" tabindex="0" aria-label="Open ${esc(p.name)}">${p.thumb?`<img src="${p.thumb}" alt="">`:''}<button class="more" aria-label="Options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></div><b>${esc(p.name)}</b><small>${ago(p.updated)}</small>`;
    const th=c.querySelector('.th');let lp=null,fired=false;
    th.addEventListener('pointerdown',()=>{fired=false;lp=setTimeout(()=>{fired=true;vibe();openMenu(p);},480);});
    ['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev=>th.addEventListener(ev,()=>clearTimeout(lp)));
    th.addEventListener('contextmenu',e=>e.preventDefault());
    th.addEventListener('click',e=>{if(fired)return;if(e.target.closest('.more')){openMenu(p);return;}openProject(p);});
    th.addEventListener('keydown',e=>{if(e.key==='Enter')openProject(p);});
    g.appendChild(c);
  });
}
function nextName(){const names=new Set(projects.map(p=>p.name));let n=projects.length+1;while(names.has('Draft '+n))n++;return'Draft '+n;}
async function newProject(file,opts={}){
  const now=Date.now();
  await openProject({id:uid(),name:nextName(),created:now,updated:now,img:file||null,state:null,thumb:null});
  if(opts.quote)addText({...yellowPreset,text:wrapQuote(opts.quote),y:H*.42},true);
  else if(opts.text)addText(yellowPreset);
  saveNow();
}
$('newFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f&&f.type.startsWith('image/'))newProject(f);};
$('newText').onclick=()=>newProject(null,{text:true});
$('newBlank').onclick=()=>newProject(null);

let menuP=null;
function openMenu(p){menuP=p;$('mThumb').src=p.thumb||'';$('mName').textContent=p.name;$('mDate').textContent='Edited '+ago(p.updated).toLowerCase();
  $('mActions').hidden=false;$('mRename').hidden=true;const d=$('mActions').querySelector('[data-act=delete]');d.classList.remove('armed');d.querySelector('span').textContent='Delete';
  $('scrim').hidden=false;}
function closeMenu(){$('scrim').hidden=true;menuP=null;}
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim'))closeMenu();});
$('mActions').querySelectorAll('.act').forEach(b=>b.addEventListener('click',async()=>{
  const p=menuP;if(!p)return;const a=b.dataset.act;vibe();
  if(a==='open'){closeMenu();openProject(p);}
  else if(a==='rename'){$('mActions').hidden=true;$('mRename').hidden=false;$('mInput').value=p.name;setTimeout(()=>{$('mInput').focus();$('mInput').select();},50);}
  else if(a==='dupe'){await dbPut({...p,id:uid(),name:p.name+' copy',created:Date.now(),updated:Date.now(),state:p.state?JSON.parse(JSON.stringify(p.state)):null});closeMenu();renderHome();toast('Duplicated');}
  else if(a==='delete'){if(!b.classList.contains('armed')){b.classList.add('armed');b.querySelector('span').textContent='Tap again to delete';return;}
    await dbDel(p.id);closeMenu();renderHome();toast('Deleted');}
}));
$('mRename').addEventListener('submit',async e=>{e.preventDefault();const p=menuP;if(!p)return;const n=$('mInput').value.trim();if(n){p.name=n;await dbPut(p);}closeMenu();renderHome();});

/* ================= EDITOR STATE ================= */
function setControls(s){
  s={...DEF,...(s||{})};SLIDERS.forEach(k=>$(k).value=s[k]);
  anchor=s.anchor;bgmode=s.bgmode;flip=!!s.flip;
  press('anchor','a',anchor);press('bgmode','m',bgmode);$('flip').setAttribute('aria-pressed',flip);
}
function snapshot(){const s={anchor,bgmode,flip,x,y,texts:texts.map(t=>({...t}))};SLIDERS.forEach(k=>s[k]=+$(k).value);return s;}
function showScreen(ed){$('editor').hidden=!ed;$('home').hidden=ed;if(ed)requestAnimationFrame(fit);}
function loadImage(blob){
  if(imgCache.has(blob))return Promise.resolve(imgCache.get(blob));
  return new Promise(res=>{const i=new Image();i.onload=()=>{imgCache.set(blob,i);res(i);};i.onerror=()=>res(null);i.src=URL.createObjectURL(blob);});
}
async function openProject(p){
  loading=true;proj=p;sel=null;texts=(p.state?.texts||[]).map(t=>({...t}));
  setControls(p.state);$('projName').textContent=p.name;
  imgBlob=p.img||null;img=null;$('empty').hidden=!!imgBlob;
  showScreen(true);closePanel();
  if(location.hash!=='#edit')history.pushState({edit:1},'','#edit');
  if(imgBlob){img=await loadImage(imgBlob);if(!img)toast('Couldn’t load this photo');
    else if(p.state&&typeof p.state.x==='number'){x=p.state.x;y=p.state.y;const s=size();prevW=s.w;prevH=s.h;}else place();}
  loading=false;hist=[];hi=-1;pushHist();draw();
}
function touch(){if(!proj||loading||saving)return;clearTimeout(saveT);saveT=setTimeout(saveNow,600);clearTimeout(histT);histT=setTimeout(pushHist,350);}
async function saveNow(){
  if(!proj)return;clearTimeout(saveT);
  saving=true;exporting=true;draw();tctx.drawImage(cv,0,0,thumbCv.width,thumbCv.height);exporting=false;draw();saving=false;
  Object.assign(proj,{state:snapshot(),thumb:thumbCv.toDataURL('image/jpeg',.75),updated:Date.now(),img:imgBlob});
  try{await dbPut(proj);}catch(e){toast('Couldn’t save draft');}
}
async function closeEditor(){if(proj){clearTimeout(histT);await saveNow();}proj=null;img=null;imgBlob=null;texts=[];sel=null;showScreen(false);renderHome();}
$('back').onclick=()=>{if(location.hash==='#edit')history.back();else closeEditor();};
window.addEventListener('popstate',()=>{if(!$('qp').hidden){closeQuotesNow();return;}if(!$('scrim').hidden){closeMenu();return;}if(!$('editor').hidden)closeEditor();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&proj)saveNow();});

/* ---------- undo / redo ---------- */
let hist=[],hi=-1,histT=null;const blobIds=new WeakMap();let blobN=0;
const bid=b=>b?(blobIds.get(b)||(blobIds.set(b,++blobN),blobN)):0;
function pushHist(){
  if(!proj||loading)return;clearTimeout(histT);
  const s=snapshot();const key=JSON.stringify(s)+'|'+bid(imgBlob);
  if(hi>=0&&hist[hi].key===key)return;
  hist=hist.slice(0,hi+1);hist.push({s,blob:imgBlob,key});if(hist.length>80)hist.shift();hi=hist.length-1;updHist();
}
function updHist(){$('undo').disabled=hi<=0;$('redo').disabled=hi>=hist.length-1;}
async function applyHist(h){
  loading=true;sel=null;setControls(h.s);texts=h.s.texts.map(t=>({...t}));x=h.s.x;y=h.s.y;
  if(h.blob!==imgBlob){imgBlob=h.blob;img=imgBlob?await loadImage(imgBlob):null;}
  $('empty').hidden=!!imgBlob;if(img){const s=size();prevW=s.w;prevH=s.h;}
  loading=false;syncTextUI();updHist();clearTimeout(saveT);saveT=setTimeout(saveNow,600);
}
function undo(){if(histT){clearTimeout(histT);pushHist();}if(hi>0){hi--;applyHist(hist[hi]);vibe();}}
function redo(){if(hi<hist.length-1){hi++;applyHist(hist[hi]);vibe();}}
$('undo').onclick=undo;$('redo').onclick=redo;
document.addEventListener('keydown',e=>{if($('editor').hidden||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
  if((e.key==='Delete'||e.key==='Backspace')&&sel){$('delText').click();}});

/* ---------- layout ---------- */
function fit(){
  const r=$('stage').getBoundingClientRect();if(!r.width)return;
  const aw=r.width-28,ah=r.height-28;let h=ah,w=h*9/16;if(w>aw){w=aw;h=w*16/9;}
  $('frame').style.width=Math.max(0,Math.floor(w))+'px';$('frame').style.height=Math.max(0,Math.floor(h))+'px';
}
new ResizeObserver(fit).observe($('stage'));

/* ---------- drawing ---------- */
function size(){const b=W/img.width;return{w:img.width*b*$('sw').value/100,h:img.height*b*$('sh').value/100};}
function place(){if(!img)return;const{w,h}=size();x=anchor==='left'?W-w:anchor==='right'?0:(W-w)/2;y=(H-h)/2;prevW=w;prevH=h;draw();}
function labels(){
  [['sw','%'],['sh','%'],['blur',''],['bgblur',''],['bgbr','%'],['bri','%'],['con','%'],['sat','%'],['tsz',''],['tsw','%'],['tsh','%']].forEach(([k,u])=>$(k+'o').textContent=$(k).value+u);
  document.querySelectorAll('input[type=range]').forEach(el=>el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%'));
}
function isLight(hex){const n=parseInt(hex.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150;}
function setFont(t){const f=FONTS[t.font];ctx.font=`${f.weight} ${t.size}px ${f.family}, sans-serif`;}
function metrics(t){setFont(t);const lines=(t.text||' ').split('\n'),lh=t.size*1.12,widths=lines.map(l=>ctx.measureText(l||' ').width);
  const pad=t.style==='box'?t.size*.28:t.style==='outline'?t.size*.12:t.size*.04;return{lines,lh,widths,pad,maxw:Math.max(...widths)};}
function bounds(t){const m=metrics(t),w=(m.maxw+m.pad*2)*t.sx/100,h=(m.lines.length*m.lh+m.pad*.8)*t.sy/100;return{x:t.x-w/2,y:t.y-h/2,w,h};}
function rr(x0,y0,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x0,y0,w,h,r);else ctx.rect(x0,y0,w,h);}
function drawText(t){
  const m=metrics(t);ctx.save();ctx.translate(t.x,t.y);ctx.scale(t.sx/100,t.sy/100);
  setFont(t);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.miterLimit=2;
  const total=m.lines.length*m.lh;
  if(t.style==='box'){ctx.fillStyle=t.color;m.lines.forEach((ln,i)=>{const ly=-total/2+m.lh*i,w=m.widths[i]+m.pad*2;rr(-w/2,ly-m.pad*.15,w,m.lh+m.pad*.3,t.size*.2);ctx.fill();});}
  m.lines.forEach((ln,i)=>{const ly=-total/2+m.lh*(i+.5)+t.size*.04;
    if(t.style==='outline'){ctx.lineWidth=t.size*.17;ctx.strokeStyle=isLight(t.color)?'#000':'#fff';ctx.strokeText(ln,0,ly);ctx.fillStyle=t.color;ctx.fillText(ln,0,ly);}
    else if(t.style==='box'){ctx.fillStyle=isLight(t.color)?'#000':'#fff';ctx.fillText(ln,0,ly);}
    else{ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=t.size*.18;ctx.shadowOffsetY=t.size*.04;ctx.fillStyle=t.color;ctx.fillText(ln,0,ly);ctx.shadowColor='transparent';}});
  ctx.restore();
}
function drawSelection(t){
  const b=bounds(t),p=12;ctx.save();ctx.lineWidth=4;ctx.strokeStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=6;ctx.strokeRect(b.x-p,b.y-p,b.w+p*2,b.h+p*2);ctx.shadowColor='transparent';
  ctx.fillStyle='#fff';[[b.x-p,b.y-p],[b.x+b.w+p,b.y-p],[b.x-p,b.y+b.h+p],[b.x+b.w+p,b.y+b.h+p]].forEach(([cx,cy])=>{ctx.fillRect(cx-9,cy-9,18,18);});
  ctx.restore();
}
function draw(){
  labels();
  ctx.filter='none';ctx.fillStyle=bgmode==='white'?'#fff':'#000';ctx.fillRect(0,0,W,H);
  if(img){
    const adj=`brightness(${$('bri').value/100}) contrast(${$('con').value/100}) saturate(${$('sat').value/100})`;
    if(bgmode==='blur'){const s=Math.max(W/img.width,H/img.height)*1.15,bw=img.width*s,bh=img.height*s;
      ctx.filter=`blur(${$('bgblur').value}px) brightness(${$('bgbr').value/100}) saturate(${$('sat').value/100})`;ctx.drawImage(img,(W-bw)/2,(H-bh)/2,bw,bh);}
    const{w,h}=size();
    ctx.filter=adj+(+$('blur').value?` blur(${$('blur').value}px)`:'');
    if(flip){ctx.save();ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(img,0,0,w,h);ctx.restore();}else ctx.drawImage(img,x,y,w,h);
    ctx.filter='none';
  }
  texts.forEach(drawText);
  if(sel&&!exporting)drawSelection(sel);
  if(!exporting)touch();
}

/* ---------- tool panel ---------- */
function openPanel(n){
  tab=n;$('panelwrap').hidden=false;$('ptitle').textContent=TOOLS[n];
  document.querySelectorAll('.tool').forEach(o=>o.setAttribute('aria-selected',+o.dataset.tab===n));
  document.querySelectorAll('.panel[data-panel]').forEach(p=>p.hidden=+p.dataset.panel!==n);
  $('pbody').scrollTop=0;
}
function closePanel(){tab=-1;$('panelwrap').hidden=true;document.querySelectorAll('.tool').forEach(o=>o.setAttribute('aria-selected',false));
  if(sel){sel=null;syncTextUI();}if(document.activeElement)document.activeElement.blur();}
document.querySelectorAll('.tool').forEach(t=>t.addEventListener('click',()=>{const n=+t.dataset.tab;vibe();if(tab===n)closePanel();else openPanel(n);}));
$('done').onclick=()=>{vibe();closePanel();};

/* ---------- controls ---------- */
function press(id,key,val){$(id).querySelectorAll('button').forEach(o=>o.setAttribute('aria-pressed',o.dataset[key]===val));}
function group(id,key,cb){$(id).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{press(id,key,b.dataset[key]);cb(b.dataset[key]);vibe();}));}
['sw','sh'].forEach(id=>$(id).addEventListener('input',()=>{if(!img)return;const{w,h}=size();
  if(anchor==='left')x-=w-prevW;else if(anchor==='center')x-=(w-prevW)/2;y-=(h-prevH)/2;prevW=w;prevH=h;draw();}));
['blur','bgblur','bgbr','bri','con','sat'].forEach(id=>$(id).addEventListener('input',draw));
group('anchor','a',a=>{anchor=a;place();});
group('bgmode','m',m=>{bgmode=m;draw();});
const fillPct=()=>Math.min(400,Math.round(H/(img.height*W/img.width)*100));
$('fillH').onclick=()=>{if(!img)return;$('sh').value=fillPct();place();vibe();};
$('fillAll').onclick=()=>{if(!img)return;$('sw').value=100;$('sh').value=fillPct();place();vibe();};
$('flip').onclick=()=>{flip=!flip;$('flip').setAttribute('aria-pressed',flip);draw();vibe();};
$('reset').onclick=()=>{['sw','sh'].forEach(k=>$(k).value=DEF[k]);anchor=DEF.anchor;press('anchor','a',anchor);flip=false;$('flip').setAttribute('aria-pressed',false);place();draw();vibe();};
$('adjReset').onclick=()=>{['bri','con','sat'].forEach(k=>$(k).value=100);draw();vibe();};

/* ---------- text ---------- */
function syncTextUI(){
  $('tnone').hidden=!!sel;$('tedit').hidden=!sel;
  if(sel){if(document.activeElement!==$('txt'))$('txt').value=sel.text;
    $('tsz').value=Math.round(sel.size);$('tsw').value=Math.round(sel.sx);$('tsh').value=Math.round(sel.sy);
    press('fontPick','f',sel.font);press('stylePick','s',sel.style);
    $('colors').querySelectorAll('.sw[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===sel.color));}
  draw();
}
function addText(preset,noFocus){
  const t=Object.assign({text:'Your text',font:'tiktok',color:'#ffffff',style:'outline',size:120,sx:100,sy:100,x:W/2,y:H*.3+(texts.length*170)%(H*.5)},preset||{});
  if(preset&&preset.text)autoFit(t);
  texts.push(t);sel=t;openPanel(1);syncTextUI();vibe();if(!noFocus)setTimeout(()=>{$('txt').focus();$('txt').select();},80);
}
const yellowPreset={color:TT_YELLOW,style:'outline',font:'tiktok'};
$('addYellow').onclick=()=>addText(yellowPreset);
$('addText').onclick=()=>addText();
$('addText2').onclick=()=>addText(sel?{font:sel.font,color:sel.color,style:sel.style}:yellowPreset);
$('delText').onclick=()=>{texts=texts.filter(t=>t!==sel);sel=null;syncTextUI();vibe();};
function autoFit(t){const b=bounds(t),max=W*.92;if(b.w>max){t.size=Math.max(30,t.size*max/b.w);$('tsz').value=Math.round(t.size);}}
$('txt').addEventListener('input',e=>{if(sel){sel.text=e.target.value;autoFit(sel);draw();}});
$('colors').querySelectorAll('.sw[data-c]').forEach(b=>b.addEventListener('click',()=>{if(!sel)return;sel.color=b.dataset.c;syncTextUI();vibe();}));
$('customColor').addEventListener('input',e=>{if(sel){sel.color=e.target.value;syncTextUI();}});
group('fontPick','f',f=>{if(sel){sel.font=f;autoFit(sel);syncTextUI();}});
group('stylePick','s',s=>{if(sel){sel.style=s;syncTextUI();}});
$('tsz').addEventListener('input',e=>{if(sel){sel.size=+e.target.value;draw();}});
$('tsw').addEventListener('input',e=>{if(sel){sel.sx=+e.target.value;draw();}});
$('tsh').addEventListener('input',e=>{if(sel){sel.sy=+e.target.value;draw();}});

/* ---------- photo input ---------- */
async function load(file){
  if(!file||!file.type.startsWith('image/'))return;
  if(!proj){newProject(file);return;}
  const i=await loadImage(file);if(!i){toast('Couldn’t open that photo');return;}
  img=i;imgBlob=file;$('empty').hidden=true;place();
}
$('file').onchange=e=>{load(e.target.files[0]);e.target.value='';};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0]);});
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])][0];if(f)load(f);});

/* ---------- gestures ---------- */
const pts=new Map();let start=null,lastTap=0,snapped=false;
const k=()=>W/cv.getBoundingClientRect().width;
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*k(),y:(e.clientY-r.top)*k()};}
function hit(p){for(let i=texts.length-1;i>=0;i--){const b=bounds(texts[i]),m=24;if(p.x>=b.x-m&&p.x<=b.x+b.w+m&&p.y>=b.y-m&&p.y<=b.y+b.h+m)return texts[i];}return null;}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    const t=hit(toCanvas(e));
    if(t!==sel){sel=t;if(t){texts=texts.filter(o=>o!==t);texts.push(t);openPanel(1);vibe();}syncTextUI();}
    const now=Date.now();if(now-lastTap<280){if(sel){sel.x=W/2;draw();}else place();vibe();}lastTap=now;
  }
  snap();
});
function snap(){const p=[...pts.values()];start={x,y,sw:+$('sw').value,sh:+$('sh').value,tx:sel?.x,ty:sel?.y,tsize:sel?.size,
  cx:p.reduce((a,b)=>a+b.x,0)/p.length,cy:p.reduce((a,b)=>a+b.y,0)/p.length,d:p.length>1?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0};}
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const p=[...pts.values()],s=k(),cx=p.reduce((a,b)=>a+b.x,0)/p.length,cy=p.reduce((a,b)=>a+b.y,0)/p.length;
  const f=p.length>1&&start.d?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/start.d:1;
  let gx=false,gy=false;
  if(sel){
    sel.x=start.tx+(cx-start.cx)*s;sel.y=start.ty+(cy-start.cy)*s;
    gx=Math.abs(sel.x-W/2)<18;gy=Math.abs(sel.y-H/2)<18;if(gx)sel.x=W/2;if(gy)sel.y=H/2;
    if((gx||gy)&&!snapped)vibe();snapped=gx||gy;
    if(f!==1){sel.size=Math.max(30,Math.min(400,start.tsize*f));$('tsz').value=Math.round(sel.size);}
  }else if(img){
    if(f!==1){const nsw=Math.max(20,Math.min(400,start.sw*f)),nsh=Math.max(20,Math.min(400,start.sh*f)),b=W/img.width;
      const ow=img.width*b*start.sw/100,oh=img.height*b*start.sh/100,nw=img.width*b*nsw/100,nh=img.height*b*nsh/100;
      $('sw').value=Math.round(nsw);$('sh').value=Math.round(nsh);x=start.x-(nw-ow)/2+(cx-start.cx)*s;y=start.y-(nh-oh)/2+(cy-start.cy)*s;prevW=nw;prevH=nh;}
    else{x=start.x+(cx-start.cx)*s;y=start.y+(cy-start.cy)*s;}
  }
  $('guides').classList.toggle('on',gx||gy);
  $('guides').querySelector('.v').style.display=gx?'':'none';$('guides').querySelector('.h').style.display=gy?'':'none';
  draw();
});
function up(e){pts.delete(e.pointerId);if(pts.size)snap();else{$('guides').classList.remove('on');snapped=false;}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- export ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1500);}
function vibe(){try{navigator.vibrate&&navigator.vibrate(6);}catch(_){}}
const fname=()=>'taffy_'+(proj?proj.name.replace(/[^\w-]+/g,'_'):'export')+'_'+Date.now()+'.png';
$('export').onclick=async()=>{
  vibe();exporting=true;draw();const dataUrl=cv.toDataURL('image/png');exporting=false;draw();saveNow();
  try{
    if(native&&Cap.Plugins.Filesystem&&Cap.Plugins.Share){
      const r=await Cap.Plugins.Filesystem.writeFile({path:fname(),data:dataUrl.split(',')[1],directory:'CACHE'});
      await Cap.Plugins.Share.share({title:'Export',files:[r.uri]});return;
    }
    const blob=await(await fetch(dataUrl)).blob(),file=new File([blob],fname(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){await navigator.share({files:[file]});return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Exported');
  }catch(err){if(err&&err.name!=='AbortError'&&!/cancel/i.test(err.message||''))toast('Export failed: '+(err.message||err));}
};

/* ---------- quote library ---------- */
const QDATA=window.QUOTES||{};
const QALL=Object.entries(QDATA).flatMap(([c,arr])=>arr.map(t=>({t,c})));
let qCat='All',qMode='editor',qOrder=null,qPending=null;
function favs(){try{return JSON.parse(localStorage.getItem('taffy-favs')||'[]');}catch(e){return[];}}
function setFavs(a){try{localStorage.setItem('taffy-favs',JSON.stringify(a));}catch(e){}}
function wrapQuote(str){
  const words=str.trim().split(/\s+/),n=str.length;
  const lines=Math.min(6,Math.max(1,Math.ceil(n/20))),target=Math.ceil(n/lines);
  const out=[];let cur='';
  words.forEach(w=>{if(cur&&(cur+' '+w).length>target+3){out.push(cur);cur=w;}else cur=cur?cur+' '+w:w;});
  if(cur)out.push(cur);return out.join('\n');
}
function renderChips(){
  const cats=['All','Saved',...Object.keys(QDATA)];
  $('qChips').innerHTML=cats.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${c===qCat}">${c==='Saved'?'&#9733; Saved':esc(c)}</button>`).join('');
  $('qChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{qCat=b.dataset.c;qOrder=null;renderChips();renderQuotes();$('qList').scrollTop=0;vibe();});
}
function renderQuotes(){
  const f=new Set(favs()),term=$('qSearch').value.trim().toLowerCase();
  let list=qCat==='All'?QALL:qCat==='Saved'?QALL.filter(q=>f.has(q.t)):QALL.filter(q=>q.c===qCat);
  if(term)list=(qCat==='Saved'?list:QALL).filter(q=>q.t.toLowerCase().includes(term)||q.c.toLowerCase().includes(term));
  if(qOrder)list=[...list].sort((a,b)=>(qOrder.get(a.t)||0)-(qOrder.get(b.t)||0));
  $('qCount').textContent=list.length;
  if(!list.length){$('qList').innerHTML=`<div class="qnone">${qCat==='Saved'&&!term?'Tap the star on any quote to save it here.':'No quotes match that search.'}</div>`;return;}
  $('qList').innerHTML=list.map((q,i)=>`<div class="q" data-i="${i}"><button class="qt">${esc(q.t)}${qCat==='All'||term?`<small>${esc(q.c)}</small>`:''}</button><div class="qa">
    <button class="fav" aria-label="Save" aria-pressed="${f.has(q.t)}"><svg viewBox="0 0 24 24" fill="${f.has(q.t)?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
    <button class="cp" aria-label="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div></div>`).join('');
  $('qList').querySelectorAll('.q').forEach(el=>{const q=list[+el.dataset.i];
    el.querySelector('.qt').onclick=()=>pickQuote(q.t);
    el.querySelector('.fav').onclick=()=>{const a=favs(),k=a.indexOf(q.t);if(k>=0)a.splice(k,1);else a.unshift(q.t);setFavs(a);vibe();renderQuotes();};
    el.querySelector('.cp').onclick=()=>copyText(q.t);
  });
}
function copyText(t){vibe();
  const done=()=>toast('Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallback());else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('Couldn’t copy');}ta.remove();}
}
function openQuotes(mode){
  qMode=mode;qOrder=null;$('qSearch').value='';renderChips();renderQuotes();$('qp').hidden=false;$('qList').scrollTop=0;
  history.pushState({q:1},'',location.href);
}
function closeQuotesNow(){$('qp').hidden=true;const p=qPending;qPending=null;if(p)p();}
function closeQuotes(){if(history.state&&history.state.q)history.back();else closeQuotesNow();}
function pickQuote(t){
  vibe();
  if(qMode==='home'){qPending=()=>newProject(null,{quote:t});}
  else qPending=()=>{
    if(sel){sel.text=wrapQuote(t);autoFit(sel);if(sel.color==='#ffffff'&&sel.style==='outline')sel.color=TT_YELLOW;syncTextUI();}
    else addText({...yellowPreset,text:wrapQuote(t),y:H*.42},true);
  };
  closeQuotes();
}
$('qClose').onclick=closeQuotes;
$('qSearch').addEventListener('input',renderQuotes);
$('qShuffle').onclick=()=>{qOrder=new Map(QALL.map(q=>[q.t,Math.random()]));renderQuotes();$('qList').scrollTop=0;vibe();};
$('homeQuotes').onclick=()=>openQuotes('home');
$('openQuotes').onclick=()=>openQuotes('editor');
$('swapQuote').onclick=()=>openQuotes('editor');
$('qcountHome').textContent=QALL.length+' captions in '+Object.keys(QDATA).length+' categories';

/* ---------- boot ---------- */
if(location.hash==='#edit')history.replaceState(null,'',location.pathname);
Promise.all(['900 60px "TikTok Sans"','900 60px Montserrat','400 60px Anton'].map(f=>document.fonts.load(f))).catch(()=>{}).then(()=>{if(proj)draw();});
renderHome();
</script>
